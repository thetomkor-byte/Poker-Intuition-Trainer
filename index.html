<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Poker Intuition Trainer</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div id="app">

    <!-- ==== ВЕРХНЯЯ ПАНЕЛЬ ==== -->
    <header id="topbar">
      <div class="topbar-left">
        <span class="logo">♠ Poker Intuition Trainer</span>
        <span class="level-info">
          Уровень <b id="level-num">0</b> ·
          Блайнды <b id="blinds-display">10/20</b>
          <span id="ante-display"></span>
        </span>
      </div>
      <div class="topbar-right">
        <button id="btn-settings" class="icon-btn" title="Настройки">⚙</button>
        <button id="btn-new-session" class="icon-btn" title="Новая сессия">↻</button>
      </div>
    </header>

    <!-- ==== СТОЛ ==== -->
    <main id="table-wrap">
      <div id="poker-table">
        <div id="board-area">
          <div id="pot-display">Банк: 0</div>
          <div id="board-cards" class="card-row"></div>
        </div>
        <!-- Игроки рендерятся динамически -->
        <div id="seats"></div>
      </div>

      <!-- ==== СТАТИСТИКА СЕССИИ ==== -->
      <aside id="stats-panel">
        <h3>Сессия</h3>
        <div class="stat-row"><span>Точность</span><b id="stat-accuracy">—</b></div>
        <div class="stat-row"><span>✅ Совпало</span><b id="stat-hit">0</b></div>
        <div class="stat-row"><span>❌ Не совпало</span><b id="stat-miss">0</b></div>
        <div class="stat-row"><span>Раздач</span><b id="stat-hands">0</b></div>
        <div class="stat-row"><span>Место</span><b id="stat-place">—</b></div>
      </aside>
    </main>

    <!-- ==== ПАНЕЛЬ ДЕЙСТВИЙ ==== -->
    <footer id="action-bar">
      <div id="feedback-banner" class="hidden"></div>

      <div id="hero-controls">
        <div class="hero-info">
          <span>Твоя рука:</span>
          <div id="hero-cards" class="card-row small"></div>
        </div>

        <div class="controls">
          <button id="btn-fold"  class="action-btn fold">Фолд</button>
          <button id="btn-check" class="action-btn check">Чек</button>
          <button id="btn-call"  class="action-btn call">Колл</button>
          <button id="btn-raise" class="action-btn raise">Рейз</button>
          <button id="btn-allin" class="action-btn allin">Олл-ин</button>
        </div>

        <div id="raise-slider-wrap" class="hidden">
          <input type="range" id="raise-slider" min="0" max="100" value="0" />
          <div class="raise-value"><b id="raise-amount">0</b></div>
          <div class="quick-btns">
            <button data-mult="0.5">½ банк</button>
            <button data-mult="0.75">¾ банка</button>
            <button data-mult="1">Банк</button>
            <button data-mult="1.5">1.5× банк</button>
            <button data-action="allin">Олл-ин</button>
          </div>
        </div>
      </div>

      <div id="timer-bar" class="hidden"><div id="timer-fill"></div></div>
    </footer>

    <!-- ==== НАСТРОЙКИ (модалка) ==== -->
    <div id="settings-modal" class="modal hidden">
      <div class="modal-content">
        <h2>Настройки</h2>

        <label class="setting">
          <span>Стиль карт</span>
          <select id="set-card-style">
            <option value="4color">4-цветные</option>
            <option value="2color">2-цветные</option>
          </select>
        </label>

        <label class="setting">
          <span>Стеки</span>
          <select id="set-stack-display">
            <option value="chips">В фишках</option>
            <option value="bb">В BB</option>
          </select>
        </label>

        <label class="setting">
          <span>Рост блайндов</span>
          <select id="set-blind-growth">
            <option value="hands">Каждые 10 раздач</option>
            <option value="time">Каждые 5 минут</option>
          </select>
        </label>

        <label class="setting">
          <span>Время на ход</span>
          <select id="set-turn-time">
            <option value="0">Без времени</option>
            <option value="10">10 секунд</option>
            <option value="20">20 секунд</option>
          </select>
        </label>

        <label class="setting checkbox">
          <input type="checkbox" id="set-show-strategies" />
          <span>Показывать стратегии ботов</span>
        </label>

        <button id="settings-close" class="action-btn">Готово</button>
      </div>
    </div>

    <!-- ==== ЭКРАН ИТОГОВ СЕССИИ ==== -->
    <div id="session-end-modal" class="modal hidden">
      <div class="modal-content">
        <h2 id="session-end-title">Сессия завершена</h2>
        <div id="session-end-stats"></div>
        <button id="session-end-new" class="action-btn raise">Новая сессия</button>
      </div>
    </div>

  </div>

  <!-- ==== Скрипты (порядок важен) ==== -->
  <script src="js/engine.js"></script>
  <script src="js/bots.js"></script>
  <script src="js/ui.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
